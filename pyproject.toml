[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evedesign"
dynamic = ["version"]
description = ''
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = []
authors = [
  { name = "Thomas Hopf", email = "thomas.hopf@gmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "numpy", "pandas", "loguru", "biotite", "biopython", "dnachisel", "scikit-learn", "numba", "scipy"
]

[project.optional-dependencies]
evmutation2 = ["torch", "evmutation2"]
evcouplings = ["evcouplings", "setuptools<81"]
esm2 = ["torch", "transformers"]
mpnn = ["torch", "prody"]
umap = ["umap-learn"]

[project.urls]
Documentation = "https://github.com/evedesignbio/evedesign#readme"
Issues = "https://github.com/evedesignbio/evedesign/issues"
Source = "https://github.com/evedesignbio/evedesign"

[tool.hatch.version]
path = "src/evedesign/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/evedesign tests}"

[tool.coverage.run]
source_pkgs = ["evedesign", "tests"]
branch = true
parallel = true
omit = [
  "src/evedesign/__about__.py",
]

[tool.coverage.paths]
evedesign = ["src/evedesign", "*/evedesign/src/evedesign"]
tests = ["tests", "*/evedesign/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
